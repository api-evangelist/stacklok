    github_com_stacklok_toolhive_pkg_authz.Config:
      description: 'DEPRECATED: Middleware configuration.

        AuthzConfig contains the authorization configuration'
      properties:
        type:
          description: Type is the type of authorization configuration (e.g., "cedarv1").
          type: string
        version:
          description: Version is the version of the configuration format.
          type: string
      type: object
    github_com_stacklok_toolhive_pkg_runner.RunConfig:
      properties:
        additional_middleware_configs:
          description: 'AdditionalMiddlewareConfigs carries pre-built middleware configs injected by

            external-auth handlers (reached via *[]RunConfigBuilderOption) rather than

            derived from typed RunConfig fields. PopulateMiddlewareConfigs splices these

            into the chain in the backend-egress group — after auth and before recovery —

            instead of discarding them. Upstream carries these configs verbatim and never

            inspects their parameters; the middleware type identity (e.g. an enterprise

            auth type) is supplied by the caller via types.MiddlewareConfig.Type.


            Each entry''s Type is expected to be a NEW egress middleware type (e.g. OBO),

            not one already produced from a typed RunConfig field (auth, authz, audit,

            tokenExchange, awssts, …). Dispatch in the proxyrunner is purely by Type

            string, so an injected Type that shadows a typed-field type would add a

            second instance of that middleware to the chain; the seam does not validate

            against this.'
          items:
            $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_transport_types.MiddlewareConfig'
          type: array
          uniqueItems: false
        allow_docker_gateway:
          description: 'AllowDockerGateway permits outbound connections to Docker gateway addresses

            (host.docker.internal, gateway.docker.internal, 172.17.0.1). These are

            blocked by default in the egress proxy even when InsecureAllowAll is set.

            Only applicable to Docker deployments with network isolation enabled.

            Gateway access is port-independent: it ignores the permission profile''s

            allowed ports, so once enabled the gateway is reachable on any port.'
          type: boolean
        allowed_origins:
          description: 'AllowedOrigins is the allowlist of values accepted on the HTTP Origin header,

            used for DNS-rebinding protection per MCP 2025-11-25 §"Security Warning".

            When empty and Host is loopback (127.0.0.1 / localhost / [::1]), a default

            loopback-only allowlist is derived at middleware-wiring time.

            When empty and Host is non-loopback, the middleware is disabled — operators

            exposing the proxy publicly must configure an explicit allowlist.'
          items:
            type: string
          type: array
          uniqueItems: false
        audit_config:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_audit.Config'
        audit_config_path:
          description: 'DEPRECATED: Middleware configuration.

            AuditConfigPath is the path to the audit configuration file'
          type: string
        authz_config:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_authz.Config'
        authz_config_path:
          description: 'DEPRECATED: Middleware configuration.

            AuthzConfigPath is the path to the authorization configuration file'
          type: string
        aws_sts_config:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_auth_awssts.Config'
        base_name:
          description: BaseName is the base name used for the container (without prefixes)
          type: string
        cmd_args:
          description: CmdArgs are the arguments to pass to the container
          items:
            type: string
          type: array
          uniqueItems: false
        container_labels:
          additionalProperties:
            type: string
          description: ContainerLabels are the labels to apply to the container
          type: object
        container_name:
          description: ContainerName is the name of the container
          type: string
        debug:
          description: Debug indicates whether debug mode is enabled
          type: boolean
        embedded_auth_server_config:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_authserver.RunConfig'
        endpoint_prefix:
          description: 'EndpointPrefix is an explicit prefix to prepend to SSE endpoint URLs.

            This is used to handle path-based ingress routing scenarios.'
          type: string
        env_file_dir:
          description: 'DEPRECATED: No longer appears to be used.

            EnvFileDir is the directory path to load environment files from'
          type: string
        env_vars:
          additionalProperties:
            type: string
          description: EnvVars are the parsed environment variables as key-value pairs
          type: object
        group:
          description: Group is the name of the group this workload belongs to, if any
          type: string
        header_forward:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_runner.HeaderForwardConfig'
        host:
          description: Host is the host for the HTTP proxy
          type: string
        ignore_config:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_ignore.Config'
        image:
          description: Image is the Docker image to run
          type: string
        isolate_network:
          description: IsolateNetwork indicates whether to isolate the network for the container
          type: boolean
        jwks_auth_token_file:
          description: 'DEPRECATED: No longer appears to be used.

            JWKSAuthTokenFile is the path to file containing auth token for JWKS/OIDC requests'
          type: string
        k8s_pod_template_patch:
          description: 'K8sPodTemplatePatch is a JSON string to patch the Kubernetes pod template

            Only applicable when using Kubernetes runtime'
          type: string
        mcpserver_generation:
          description: 'MCPServerGeneration is the K8s .metadata.generation of the MCPServer CR that rendered

            this RunConfig. The Kubernetes runtime uses it as a monotonic version to prevent stale

            rolling-update pods from overwriting a newer RunConfig''s StatefulSet apply. Zero value

            means unversioned (backward-compat with older operators, or non-operator callers).'
          type: integer
        middleware_configs:
          description: 'MiddlewareConfigs contains the list of middleware to apply to the transport

            and the configuration for each middleware.'
          items:
            $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_transport_types.MiddlewareConfig'
          type: array
          uniqueItems: false
        mutating_webhooks:
          description: 'MutatingWebhooks contains the configuration for mutating webhook middleware.

            Mutating webhooks run before validating webhooks, per RFC THV-0017 ordering.'
          items:
            $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_webhook.Config'
          type: array
          uniqueItems: false
        name:
          description: Name is the name of the MCP server
          type: string
        oidc_config:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_auth.TokenValidatorConfig'
        permission_profile_name_or_path:
          description: PermissionProfileNameOrPath is the name or path of the permission profile
          type: string
        port:
          description: Port is the port for the HTTP proxy to listen on (host port)
          type: integer
        proxy_mode:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_transport_types.ProxyMode'
        publish:
          description: Publish lists ports to publish to the host in format "hostPort:containerPort"
          items:
            type: string
          type: array
          uniqueItems: false
        rate_limit_config:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_cmd_thv-operator_api_v1beta1.RateLimitConfig'
        rate_limit_namespace:
          description: RateLimitNamespace is the Kubernetes namespace for Redis key derivation.
          type: string
        registry_api_url:
          description: 'RegistryAPIURL is the registry API URL that served this server''s metadata.

            Empty when the server was not discovered via registry lookup.'
          type: string
        registry_server_name:
          description: 'RegistryServerName is the registry entry name used to look up this server''s metadata.

            Empty when the server was not discovered via registry lookup.'
          type: string
        registry_url:
          description: 'RegistryURL is the registry URL that served this server''s metadata.

            Empty when the server was not discovered via registry lookup.'
          type: string
        remote_auth_config:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_auth_remote.Config'
        remote_url:
          description: RemoteURL is the URL of the remote MCP server (if running remotely)
          type: string
        runtime_config:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_container_templates.RuntimeConfig'
        scaling_config:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_runner.ScalingConfig'
        schema_version:
          description: SchemaVersion is the version of the RunConfig schema
          type: string
        secrets:
          description: 'Secrets are the secret parameters to pass to the container

            Format: "<secret name>,target=<target environment variable>"'
          items:
            type: string
          type: array
          uniqueItems: false
        session_ttl:
          description: 'SessionTTL is the inactivity timeout for proxy sessions, expressed as a Go

            duration string (e.g. "30m", "2h", "168h"). Empty uses the transport

            default (2h). Negative durations and values that fail time.ParseDuration

            are rejected at runtime.

            String (not time.Duration) keeps the wire format unit-explicit: a

            time.Duration field serializes as nanoseconds in JSON.'
          example: 2h
          type: string
        stateless:
          description: 'Stateless indicates the server only supports POST (no SSE/GET).

            When true, the proxy returns 405 for incoming GET requests and uses a

            POST-based health check instead of the default GET probe.

            Applies to both remote URLs and local container workloads.'
          type: boolean
        target_host:
          description: TargetHost is the host to forward traffic to (only applicable to SSE transport)
          type: string
        target_port:
          description: TargetPort is the port for the container to expose (only applicable to SSE transport)
          type: integer
        telemetry_config:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_telemetry.Config'
        thv_ca_bundle:
          description: 'DEPRECATED: No longer appears to be used.

            ThvCABundle is the path to the CA certificate bundle for ToolHive HTTP operations'
          type: string
        token_exchange_config:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_oauthproto_tokenexchange.Config'
        tools_filter:
          description: 'DEPRECATED: Middleware configuration.

            ToolsFilter is the list of tools to filter'
          items:
            type: string
          type: array
          uniqueItems: false
        tools_override:
          additionalProperties:
            $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_runner.ToolOverride'
          description: 'DEPRECATED: Middleware configuration.

            ToolsOverride is a map from an actual tool to its overridden name and/or description'
          type: object
        transport:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_transport_types.TransportType'
        trust_proxy_headers:
          description: TrustProxyHeaders indicates whether to trust X-Forwarded-* headers from reverse proxies
          type: boolean
        upstream_swap_config:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_auth_upstreamswap.Config'
        validating_webhooks:
          description: ValidatingWebhooks contains the configuration for validating webhook middleware.
          items:
            $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_webhook.Config'
          type: array
          uniqueItems: false
        volumes:
          description: 'Volumes are the directory mounts to pass to the container

            Format: "host-path:container-path[:ro]"'
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    github_com_stacklok_toolhive_pkg_authserver.OAuth2UpstreamRunConfig:
      description: 'OAuth2Config contains OAuth 2.0-specific configuration.

        Required when Type is "oauth2", must be nil when Type is "oidc".'
      properties:
        additional_authorization_params:
          additionalProperties:
            type: string
          description: 'AdditionalAuthorizationParams are extra query parameters to include in

            authorization requests. Useful for provider-specific parameters like

            Google''s access_type=offline.'
          type: object
        allow_private_ips:
          description: 'AllowPrivateIPs permits the upstream provider''s HTTP client to connect to

            private IP ranges (RFC-1918, link-local). When DCRConfig is set, this

            also gates the DCR discovery and registration calls made on this

            upstream''s behalf (see pkg/authserver/runner/dcr_adapter.go), so a

            single flag covers the whole upstream rather than needing a separate

            DCR-specific setting. Use only when the upstream is hosted inside the

            same cluster and has no public endpoint. HTTP-scheme restrictions are

            unchanged — HTTPS is still required for non-localhost hosts. Defaults

            to false.'
          type: boolean
        authorization_endpoint:
          description: AuthorizationEndpoint is the URL for the OAuth authorization endpoint.
          type: string
        client_id:
          description: 'ClientID is the OAuth 2.0 client identifier registered with the upstream IDP.

            Mutually exclusive with DCRConfig: when DCRConfig is set, ClientID is obtained

            at runtime via RFC 7591 Dynamic Client Registration and must be left empty.'
          type: string
        client_secret_env_var:
          description: 'ClientSecretEnvVar is the name of an environment variable containing the client secret.

            Mutually exclusive with ClientSecretFile. Optional for public clients using PKCE.'
          type: string
        client_secret_file:
          description: 'ClientSecretFile is the path to a file containing the OAuth 2.0 client secret.

            Mutually exclusive with ClientSecretEnvVar. Optional for public clients using PKCE.'
          type: string
        dcr_config:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_authserver.DCRUpstreamConfig'
        identity_from_token:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_authserver.IdentityFromTokenRunConfig'
        insecure_allow_http:
          description: 'InsecureAllowHTTP permits plain-HTTP authorization and token endpoint URLs

            for this upstream. Only for in-cluster development environments (e.g. an

            OAuth2 provider served over HTTP in a kind cluster) where TLS is not

            available. Never set this in production.'
          type: boolean
        redirect_uri:
          description: 'RedirectURI is the callback URL where the upstream IDP will redirect after authentication.

            When not specified, defaults to `{issuer}/oauth/callback`.'
          type: string
        scopes:
          description: Scopes are the OAuth scopes to request from the upstream IDP.
          items:
            type: string
          type: array
          uniqueItems: false
        token_endpoint:
          description: TokenEndpoint is the URL for the OAuth token endpoint.
          type: string
        token_response_mapping:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_authserver.TokenResponseMappingRunConfig'
        userinfo:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_authserver.UserInfoRunConfig'
      type: object
    github_com_stacklok_toolhive_pkg_container_runtime.WorkloadStatus:
      description: Current status of the workload
      enum:
      - running
      - stopped
      - error
      - starting
      - stopping
      - unhealthy
      - removing
      - unknown
      - unauthenticated
      - auth_retrying
      - policy_stopped
      - running
      - stopped
      - error
      - starting
      - stopping
      - unhealthy
      - removing
      - unknown
      - unauthenticated
      - auth_retrying
      - policy_stopped
      - running
      - stopped
      - error
      - starting
      - stopping
      - unhealthy
      - removing
      - unknown
      - unauthenticated
      - auth_retrying
      - policy_stopped
      type: string
      x-enum-varnames:
      - WorkloadStatusRunning
      - WorkloadStatusStopped
      - WorkloadStatusError
      - WorkloadStatusStarting
      - WorkloadStatusStopping
      - WorkloadStatusUnhealthy
      - WorkloadStatusRemoving
      - WorkloadStatusUnknown
      - WorkloadStatusUnauthenticated
      - WorkloadStatusAuthRetrying
      - WorkloadStatusPolicyStopped
    pkg_api_v1.headerForwardConfig:
      description: 'HeaderForward configures headers to inject into requests to remote MCP servers.

        Use this to add custom headers like X-Tenant-ID or correlation IDs.'
      properties:
        add_headers_from_secret:
          additionalProperties:
            type: string
          description: 'AddHeadersFromSecret maps header names to secret names in ToolHive''s secrets manager.

            Key: HTTP header name, Value: secret name in the secrets manager'
          type: object
        add_plaintext_headers:
          additionalProperties:
            type: string
          description: 'AddPlaintextHeaders contains literal header values to inject.

            WARNING: These values are stored and transmitted in plaintext.

            Use AddHeadersFromSecret for sensitive data like API keys.'
          type: object
      type: object
    github_com_stacklok_toolhive_pkg_authserver_storage.SentinelRunConfig:
      description: 'SentinelConfig contains Sentinel-specific configuration.

        Mutually exclusive with Addr.'
      properties:
        db:
          description: 'DB is the Redis database number (default: 0).'
          type: integer
        master_name:
          description: MasterName is the name of the Redis Sentinel master.
          type: string
        sentinel_addrs:
          description: SentinelAddrs is the list of Sentinel addresses (host:port).
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    github_com_stacklok_toolhive_pkg_secrets.SecretParameter:
      description: Bearer token for authentication (alternative to OAuth)
      properties:
        name:
          type: string
        target:
          type: string
      type: object
    pkg_api_v1.upgradeCheckBulkResponse:
      description: Results of checking multiple workloads for available upgrades
      properties:
        results:
          description: 'Results holds one upgrade-check outcome per scoped workload, in the order

            the workloads were enumerated. Each entry carries only metadata and never

            secret values.'
          items:
            $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_workloads_upgrade.CheckResult'
          type: array
          uniqueItems: false
      type: object
    github_com_stacklok_toolhive_pkg_runner.ScalingConfig:
      description: 'ScalingConfig contains configuration for horizontal scaling of the proxy runner.

        Only applicable when running in Kubernetes with the ToolHive operator.

        When nil, no scaling configuration is applied (single-replica default behavior).'
      properties:
        backend_replicas:
          description: 'BackendReplicas is the desired StatefulSet replica count for the proxy runner backend.

            When nil, replicas are unmanaged (preserving HPA or manual kubectl control).

            When set (including 0), the value is an explicit replica count.'
          type: integer
        session_redis:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_runner.SessionRedisConfig'
      type: object
    github_com_stacklok_toolhive_pkg_authserver.UpstreamRunConfig:
      properties:
        name:
          description: 'Name uniquely identifies this upstream.

            Used for routing decisions and session binding in multi-upstream scenarios.

            If empty when only one upstream is configured, defaults to "default".'
          type: string
        oauth2_config:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_authserver.OAuth2UpstreamRunConfig'
        oidc_config:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_authserver.OIDCUpstreamRunConfig'
        type:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_authserver.UpstreamProviderType'
      type: object
    github_com_stacklok_toolhive_pkg_ignore.Config:
      description: IgnoreConfig contains configuration for ignore processing
      properties:
        loadGlobal:
          description: Whether to load global ignore patterns
          type: boolean
        printOverlays:
          description: Whether to print resolved overlay paths for debugging
          type: boolean
      type: object
    github_com_stacklok_toolhive_pkg_authserver.TokenResponseMappingRunConfig:
      description: 'TokenResponseMapping configures custom field extraction from non-standard token responses.

        When set, the token exchange bypasses golang.org/x/oauth2 and extracts fields using

        the configured dot-notation paths.'
      properties:
        access_token_path:
          description: AccessTokenPath is the dot-notation path to the access token (required).
          type: string
        expires_in_path:
          description: ExpiresInPath is the dot-notation path to the expires_in value. Defaults to "expires_in".
          type: string
        refresh_token_path:
          description: RefreshTokenPath is the dot-notation path to the refresh token. Defaults to "refresh_token".
          type: string
        scope_path:
          description: ScopePath is the dot-notation path to the scope. Defaults to "scope".
          type: string
      type: object
    github_com_stacklok_toolhive_pkg_authserver.DCRUpstreamConfig:
      description: 'DCRConfig enables RFC 7591 Dynamic Client Registration against the

        upstream authorization server. When set, the client credentials are

        obtained at runtime rather than being pre-provisioned via ClientID /

        ClientSecretFile / ClientSecretEnvVar, and ClientID must be left empty.

        Mutually exclusive with ClientID.'
      properties:
        discovery_url:
          description: 'DiscoveryURL is the exact RFC 8414 / OIDC Discovery document URL to

            fetch at runtime. The resolver issues a single GET against this URL

            (no well-known-path fallback) and reads registration_endpoint,

            authorization_endpoint, token_endpoint,

            token_endpoint_auth_methods_supported, and scopes_supported from the

            response. Per RFC 8414 §3.3, the document''s "issuer" field must

            exactly match the upstream issuer configured on the parent

            run-config.


            Use this field when the upstream publishes discovery metadata at a

            path that differs from the issuer-derived well-known paths — for

            example a multi-tenant IdP whose metadata lives at

            https://idp.example.com/tenants/acme/.well-known/openid-configuration.


            Mutually exclusive with RegistrationEndpoint.'
          type: string
        initial_access_token_env_var:
          description: 'InitialAccessTokenEnvVar is the name of an environment variable

            containing the RFC 7591 initial access token. Mutually exclusive with

            InitialAccessTokenFile.'
          type: string
        initial_access_token_file:
          description: 'InitialAccessTokenFile is the path to a file containing the RFC 7591

            initial access token presented to the registration endpoint. Mutually

            exclusive with InitialAccessTokenEnvVar. Both may be omitted for open

            registration endpoints.'
          type: string
        registration_endpoint:
          description: 'RegistrationEndpoint is the RFC 7591 registration endpoint URL used

            directly, bypassing discovery. Because no discovery is performed,

            server-capability fields (token_endpoint_auth_methods_supported,

            scopes_supported) are unavailable on this code path; the caller is

            expected to also supply AuthorizationEndpoint, TokenEndpoint, and an

            explicit Scopes list on the parent OAuth2UpstreamRunConfig. Auth

            method falls back to the resolver''s default (client_secret_basic).


            Mutually exclusive with DiscoveryURL.'
          type: string
        software_id:
          description: 'SoftwareID is the RFC 7591 "software_id" registration metadata value,

            identifying the client software independent of any particular

            registration instance.'
          type: string
        software_statement:
          description: 'SoftwareStatement is the RFC 7591 "software_statement" JWT asserting

            metadata about the client software, signed by a party the authorization

            server trusts.'
          type: string
      type: object
    github_com_stacklok_toolhive_pkg_ratelimit_types.RateLimitBucket:
      description: 'PerUser token bucket configuration for this tool.

        +optional'
      properties:
        maxTokens:
          description: 'MaxTokens is the maximum number of tokens (bucket capacity).

            This is also the burst size: the maximum number of requests that can be served

            instantaneously before the bucket is depleted.

            +kubebuilder:validation:Required

            +kubebuilder:validation:Minimum=1'
          type: integer
        refillPeriod:
          $ref: '#/components/schemas/v1.Duration'
      type: object
    github_com_stacklok_toolhive_pkg_workloads_upgrade.EnvVarDrift:
      description: 'EnvVarDrift describes environment variables the candidate registry entry

        declares that differ from the workload''s current configuration.'
      properties:
        added:
          description: 'Added lists environment variables the candidate declares that the

            workload does not currently supply (via plain env vars or secrets).'
          items:
            $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_workloads_upgrade.EnvVarInfo'
          type: array
          uniqueItems: false
        removed:
          description: 'Removed lists environment variables the workload supplies that the

            candidate no longer declares. Populated on a best-effort basis; may be

            empty even when removals exist (forward-compatible field).'
          items:
            $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_workloads_upgrade.EnvVarInfo'
          type: array
          uniqueItems: false
      type: object
    github_com_stacklok_toolhive_pkg_runner.HeaderForwardConfig:
      description: HeaderForward contains configuration for injecting headers into requests to remote servers.
      properties:
        add_headers_from_secret:
          additionalProperties:
            type: string
          description: 'AddHeadersFromSecret is a map of header names to secret names.

            The key is the header name, the value is the secret name in ToolHive''s secrets manager.

            Resolved at runtime via WithSecrets() into resolvedHeaders.

            The actual secret value is only held in memory, never persisted.'
          type: object
        add_plaintext_headers:
          additionalProperties:
            type: string
          description: 'AddPlaintextHeaders is a map of header names to literal values to inject into requests.

            WARNING: These values are stored in plaintext in the configuration.

            For sensitive values (API keys, tokens), use AddHeadersFromSecret instead.'
          type: object
      type: object
    github_com_stacklok_toolhive_pkg_auth_upstreamswap.Config:
      description: 'UpstreamSwapConfig contains configuration for upstream token swap middleware.

        When set along with EmbeddedAuthServerConfig, this middleware exchanges ToolHive JWTs

        for upstream IdP tokens before forwarding requests to the MCP server.'
      properties:
        custom_header_name:
          description: CustomHeaderName is the header name when HeaderStrategy is "custom".
          type: string
        header_strategy:
          description: 'HeaderStrategy determines how to inject the token: "replace" (default) or "custom".'
          type: string
        provider_name:
          description: 'ProviderName identifies which upstream provider''s tokens to retrieve for injection.

            This is required and must match a configured upstream provider name.'
          type: string
      type: object
    permissions.Profile:
      description: Permission profile to apply
      properties:
        name:
          description: Name is the name of the profile
          type: string
        network:
          $ref: '#/components/schemas/permissions.NetworkPermissions'
        privileged:
          description: 'Privileged indicates whether the container should run in privileged mode

            When true, the container has access to all host devices and capabilities

            Use with extreme caution as this removes most security isolation'
          type: boolean
        read:
          description: 'Read is a list of mount declarations that the container can read from

            These can be in the following formats:

            - A single path: The same path will be mounted from host to container

            - host-path:container-path: Different paths for host and container

            - resource-uri:container-path: Mount a resource identified by URI to a container path'
          items:
            type: string
          type: array
          uniqueItems: false
        write:
          description: 'Write is a list of mount declarations that the container can write to

            These follow the same format as Read mounts but with write permissions'
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    github_com_stacklok_toolhive_pkg_transport_types.ProxyMode:
      description: 'ProxyMode is the effective HTTP protocol the proxy uses.

        For stdio transports, this is the configured mode (sse or streamable-http).

        For direct transports (sse/streamable-http), this matches the transport type.

        Note: "sse" is deprecated; use "streamable-http" instead.'
      enum:
      - sse
      - streamable-http
      - sse
      - streamable-http
      type: string
      x-enum-varnames:
      - ProxyModeSSE
      - ProxyModeStreamableHTTP
    pkg_api_v1.bulkOperationRequest:
      properties:
        group:
          description: Group name to operate on (mutually exclusive with names)
          type: string
        names:
          description: Names of the workloads to operate on
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    github_com_stacklok_toolhive_pkg_authserver_storage.RedisTLSRunConfig:
      description: SentinelTLS configures TLS for Sentinel connections. Only applies when SentinelConfig is set.
      properties:
        ca_cert_file:
          description: CACertFile is the path to a PEM-encoded CA certificate file.
          type: string
        insecure_skip_verify:
          description: InsecureSkipVerify skips certificate verification.
          type: boolean
      type: object
    github_com_stacklok_toolhive_pkg_authserver.OIDCUpstreamRunConfig:
      description: 'OIDCConfig contains OIDC-specific configuration.

        Required when Type is "oidc", must be nil when Type is "oauth2".'
      properties:
        additional_authorization_params:
          additionalProperties:
            type: string
          description: 'AdditionalAuthorizationParams are extra query parameters to include in

            authorization requests. Useful for provider-specific parameters like

            Google''s access_type=offline.'
          type: object
        allow_private_ips:
          description: 'AllowPrivateIPs permits the OIDC discovery and token HTTP clients to

            connect to private IP ranges (RFC-1918, link-local). Use only when the

            upstream is hosted inside the same cluster and has no public endpoint.

            HTTP-scheme restrictions are unchanged — HTTPS is still required for

            non-localhost hosts. Defaults to false.'
          type: boolean
        client_id:
          description: ClientID is the OAuth 2.0 client identifier registered with the upstream IDP.
          type: string
        client_secret_env_var:
          description: 'ClientSecretEnvVar is the name of an environment variable containing the client secret.

            Mutually exclusive with ClientSecretFile. Optional for public clients using PKCE.'
          type: string
        client_secret_file:
          description: 'ClientSecretFile is the path to a file containing the OAuth 2.0 client secret.

            Mutually exclusive with ClientSecretEnvVar. Optional for public clients using PKCE.'
          type: string
        insecure_allow_http:
          description: 'InsecureAllowHTTP permits a plain-HTTP issuer URL and HTTP discovery

            endpoints for this upstream. Only for in-cluster development environments

            (e.g. Dex served over HTTP in a kind cluster) where TLS is not available.

            Never set this in production.'
          type: boolean
        issuer_url:
          description: 'IssuerURL is the OIDC issuer URL for automatic endpoint discovery.

            Must be a valid HTTPS URL.'
          type: string
        redirect_uri:
          description: 'RedirectURI is the callback URL where the upstream IDP will redirect after authentication.

            When not specified, defaults to `{issuer}/oauth/callback`.'
          type: string
        scopes:
          description: 'Scopes are the OAuth scopes to request from the upstream IDP.

            If not specified, defaults to ["openid", "offline_access"].

            When using AdditionalAuthorizationParams with provider-specific refresh

            token mechanisms (e.g., Google''s access_type=offline), set explicit scopes

            to avoid sending both offline_access and the provider-specific parameter.'
          items:
            type: string
          type: array
          uniqueItems: false
        subject_claim:
          description: 'SubjectClaim names the validated ID-token claim to use as the upstream

            subject. Defaults to "sub" when empty. Set for IdPs where "sub" isn''t

            stable per user (e.g. Entra/Azure AD''s "oid"). See upstream.OIDCConfig.'
          type: string
        userinfo_override:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_authserver.UserInfoRunConfig'
      type: object
    github_com_stacklok_toolhive_pkg_authserver.SigningKeyRunConfig:
      description: 'SigningKeyConfig configures the signing key provider for JWT operations.

        If nil or empty, an ephemeral signing key will be auto-generated (development only).'
      properties:
        fallback_key_files:
          description: 'FallbackKeyFiles are filenames of additional keys for verification (relative to KeyDir).

            These keys are included in the JWKS endpoint for token verification but are NOT

            used for signing new tokens. Useful for key rotation.'
          items:
            type: string
          type: array
          uniqueItems: false
        key_dir:
          description: 'KeyDir is the directory containing PEM-encoded private key files.

            All key filenames are relative to this directory.

            In Kubernetes, this is typically a mounted Secret volume.'
          type: string
        signing_key_file:
          description: 'SigningKeyFile is the filename of the primary signing key (relative to KeyDir).

            This key is used for signing new tokens.'
          type: string
      type: object
    pkg_api_v1.toolOverride:
      description: Tool override
      properties:
        description:
          description: Description of the tool
          type: string
        name:
          description: Name of the tool
          type: string
      type: object
    registry.Header:
      properties:
        choices:
          description: Choices provides a list of valid values for the header (optional)
          items:
            type: string
          type: array
          uniqueItems: false
        default:
          description: 'Default is the value to use if the header is not explicitly provided

            Only used for non-required headers'
          type: string
        description:
          description: Description is a human-readable explanation of the header's purpose
          type: string
        name:
          description: Name is the header name (e.g., X-API-Key, Authorization)
          type: string
        required:
          description: 'Required indicates whether this header must be provided

            If true and not provided via command line or secrets, the user will be prompted for a value'
          type: boolean
        secret:
          description: 'Secret indicates whether this header contains sensitive information

            If true, the value will be stored as a secret rather than as plain text'
          type: boolean
      type: object
    github_com_stacklok_toolhive_pkg_authserver.RunConfig:
      description: 'EmbeddedAuthServerConfig contains configuration for the embedded OAuth2/OIDC authorization server.

        When set, the proxy runner will start an embedded auth server that delegates to upstream IDPs.

        This is the serializable RunConfig; secrets are referenced by file paths or env var names.'
      properties:
        allowed_audiences:
          description: 'AllowedAudiences is the list of valid resource URIs that tokens can be issued for.

            Per RFC 8707, the "resource" parameter in authorization and token requests is

            validated against this list. Required for MCP compliance.'
          items:
            type: string
          type: array
          uniqueItems: false
        authorization_endpoint_base_url:
          description: 'AuthorizationEndpointBaseURL overrides the base URL used for the authorization_endpoint

            in the OAuth discovery document. When set, the discovery document will advertise

            `{authorization_endpoint_base_url}/oauth/authorize` instead of `{issuer}/oauth/authorize`.

            All other endpoints remain derived from the issuer.'
          type: string
        baseline_client_scopes:
          description: 'BaselineClientScopes is a baseline set of OAuth 2.0 scopes unioned into every

            DCR registration. All values must appear in ScopesSupported; the auth server

            rejects this RunConfig at startup otherwise. Empty means current behavior is

            preserved (registered scope = client-requested, or DefaultScopes if empty).

            When ScopesSupported is empty, the subset check uses registration.DefaultScopes

            (the same set applyDefaults would substitute at startup) — so

            BaselineClientScopes containing standard OIDC scopes works without enumerating

            ScopesSupported explicitly.'
          items:
            type: string
          type: array
          uniqueItems: false
        cimd:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_authserver.CIMDRunConfig'
        delegation_token_lifespan:
          description: 'DelegationTokenLifespan is the maximum lifetime for delegated tokens issued

            via RFC 8693 token exchange. Specified as a Go duration string (e.g., "15m").

            If empty, defaults to 15 minutes.'
          type: string
        disable_upstream_token_injection:
          description: 'DisableUpstreamTokenInjection prevents the upstream swap middleware from being added.

            When true, the embedded auth server handles OAuth flows for clients, but instead of

            injecting upstream IdP tokens the proxy strips the client''s credential headers

            (Authorization, Cookie, Proxy-Authorization) after the JWT is validated — the

            backend receives an unauthenticated request. Incompatible with token exchange

            and AWS STS, which would re-add credentials after the strip.'
          type: boolean
        hmac_secret_files:
          description: 'HMACSecretFiles contains file paths to HMAC secrets for signing authorization codes

            and refresh tokens (opaque tokens).

            First file is the current secret (must be at least 32 bytes), subsequent files

            are for rotation/verification of existing tokens.

            If empty, an ephemeral secret will be auto-generated (development only).'
          items:
            type: string
          type: array
          uniqueItems: false
        insecure_allow_http:
          description: 'InsecureAllowHTTP permits an http:// issuer URL for non-localhost hosts.

            Only set this for in-cluster Kubernetes deployments on a trusted network.

            Production deployments reachable outside the cluster MUST use https://.'
          type: boolean
        issuer:
          description: 'Issuer is the issuer identifier for this authorization server.

            This will be included in the "iss" claim of issued tokens.

            Must be a valid HTTPS URL (or HTTP for localhost) without query, fragment, or trailing slash.'
          type: string
        schema_version:
          description: SchemaVersion is the version of the RunConfig schema.
          type: string
        scopes_supported:
          description: 'ScopesSupported lists the OAuth 2.0 scope values advertised in discovery documents.

            If empty, defaults to registration.DefaultScopes (["openid", "profile", "email", "offline_access"]).'
          items:
            type: string
          type: array
          uniqueItems: false
        signing_key_config:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_authserver.SigningKeyRunConfig'
        storage:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_authserver_storage.RunConfig'
        token_lifespans:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_authserver.TokenLifespanRunConfig'
        upstreams:
          description: 'Upstreams configures connections to upstream Identity Providers.

            At least one upstream is required - the server delegates authentication to these providers.

            Multiple upstreams are supported for sequential authorization chains.'
          items:
            $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_authserver.UpstreamRunConfig'
          type: array
          uniqueItems: false
      type: object
    github_com_stacklok_toolhive_pkg_runner.ToolOverride:
      properties:
        description:
          description: Description is the redefined description of the tool
          type: string
        name:
          description: Name is the redefined name of the tool
          type: string
      type: object
    github_com_stacklok_toolhive_pkg_workloads_upgrade.EnvVarInfo:
      properties:
        default:
          description: 'Default is the candidate''s default value. It is cleared (left empty)

            whenever Secret is true: a secret env var''s default could carry sensitive

            data, and surfacing it in a drift report (which may be logged or returned

            over the API) would leak it. Non-secret defaults are safe to display.'
          type: string
        description:
          description: Description is the human-readable purpose of the variable.
          type: string
        name:
          description: Name is the environment variable name.
          type: string
        required:
          description: Required indicates whether the candidate marks the variable as required.
          type: boolean
        secret:
          description: Secret indicates whether the variable holds sensitive data.
          type: boolean
      type: object
    pkg_api_v1.createWorkloadResponse:
      description: Response after successfully creating a workload
      properties:
        name:
          description: Name of the created workload
          type: string
        port:
          description: Port the workload is listening on
          type: integer
      type: object
    pkg_api_v1.workloadStatusResponse:
      description: Response containing workload status information
      properties:
        status:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_container_runtime.WorkloadStatus'
      type: object
    pkg_api_v1.upgradeCheckResponse:
      description: Result of checking a single workload for an available upgrade
      properties:
        result:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_workloads_upgrade.CheckResult'
      type: object
    github_com_stacklok_toolhive_pkg_transport_types.TransportType:
      description: Transport is the transport mode (stdio, sse, or streamable-http)
      enum:
      - stdio
      - sse
      - streamable-http
      - inspector
      - stdio
      - sse
      - streamable-http
      - inspector
      - stdio
      - sse
      - streamable-http
      - inspector
      type: string
      x-enum-varnames:
      - TransportTypeStdio
      - TransportTypeSSE
      - TransportTypeStreamableHTTP
      - TransportTypeInspector
    github_com_stacklok_toolhive_pkg_auth.TokenValidatorConfig:
      description: 'DEPRECATED: Middleware configuration.

        OIDCConfig contains OIDC configuration'
      properties:
        allowPrivateIP:
          description: AllowPrivateIP allows JWKS/OIDC endpoints on private IP addresses
          type: boolean
        audience:
          description: Audience is the expected audience for the token
          type: string
        authTokenFile:
          description: AuthTokenFile is the path to file containing bearer token for authentication
          type: string
        cacertPath:
          description: CACertPath is the path to the CA certificate bundle for HTTPS requests
          type: string
        clientID:
          description: ClientID is the OIDC client ID
          type: string
        clientSecret:
          description: ClientSecret is the optional OIDC client secret for introspection
          type: string
        insecureAllowHTTP:
          description: 'InsecureAllowHTTP allows HTTP (non-HTTPS) OIDC issuers for development/testing

            WARNING: This is insecure and should NEVER be used in production'
          type: boolean
        introspectionURL:
          description: IntrospectionURL is the optional introspection endpoint for validating tokens
          type: string
        issuer:
          description: Issuer is the OIDC issuer URL (e.g., https://accounts.google.com)
          type: string
        jwksurl:
          description: JWKSURL is the URL to fetch the JWKS from
          type: string
        resourceURL:
          description: ResourceURL is the explicit resource URL for OAuth discovery (RFC 9728)
          type: string
        scopes:
          description: 'Scopes is the list of OAuth scopes to advertise in the well-known endpoint (RFC 9728)

            If empty, defaults to ["openid"]'
          items:
            type: string
          type: array
      type: object
    permissions.InboundNetworkPermissions:
      description: Inbound defines inbound network permissions
      properties:
        allow_host:
          description: AllowHost is a list of allowed hosts for inbound connections
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    github_com_stacklok_toolhive_pkg_container_templates.RuntimeConfig:
      description: 'RuntimeConfig allows overriding the default runtime configuration

        for this specific workload (base images and packages)'
      properties:
        additional_packages:
          description: 'AdditionalPackages lists extra packages to install in the builder and

            runtime stages.

            Examples for Alpine: ["git", "make", "gcc"]

            Examples for Debian: ["git", "build-essential"]'
          items:
            type: string
          type: array
          uniqueItems: false
        builder_image:
          description: 'BuilderImage is the full image reference for the builder stage.

            An empty string signals "use the default for this transport type" during config merging.

            Examples: "golang:1.26-alpine", "node:24-alpine", "python:3.14-slim"'
          type: string
        runtime_env:
          additionalProperties:
            type: string
          description: 'RuntimeEnv contains environment variables to inject into the Dockerfile''s

            final runtime stage. Unlike BuildEnv (pkg/container/templates.TemplateData.BuildEnv),

            which only affects the builder stage, these variables are baked into the

            shipped image and are present in the running container''s process

            environment at startup. Use this for values a packaged MCP server reads at

            process start (e.g. feature flags, cache backend selection), not for

            build-time package manager configuration.

            Keys must be uppercase with underscores, values are validated for safety.'
          type: object
      type: object
    github_com_stacklok_toolhive_pkg_authserver.UserInfoRunConfig:
      description: 'UserInfo contains configuration for fetching user information.

        Optional: when nil, the upstream OAuth2 provider derives a deterministic

        subject by SHA-256-hashing the access token (with a "tk-" prefix) instead

        of calling a userinfo endpoint. OIDC providers always derive Subject from

        the ID token and are unaffected.'
      properties:
        additional_headers:
          additionalProperties:
            type: string
          description: 'AdditionalHeaders contains extra headers to include in the userinfo request.

            Useful for providers that require specific headers (e.g., GitHub''s Accept header).'
          type: object
        endpoint_url:
          description: EndpointURL is the URL of the userinfo endpoint.
          type: string
        field_mapping:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_authserver.UserInfoFieldMappingRunConfig'
        http_method:
          description: 'HTTPMethod is the HTTP method to use for the userinfo request.

            If not specified, defaults to GET.'
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: 'OAuth 2.0 Bearer token authentication. Format: "Bearer {token}"'
      in: header
      name: Authorization
      type: apiKey

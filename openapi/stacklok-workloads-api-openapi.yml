          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    github_com_stacklok_toolhive_pkg_transport_types.MiddlewareConfig:
      properties:
        parameters:
          description: 'Parameters is a JSON object containing the middleware parameters.

            It is stored as a raw message to allow flexible parameter types.'
          type: object
        type:
          description: Type is a string representing the middleware type.
          type: string
      type: object
    github_com_stacklok_toolhive_pkg_runner.SessionRedisConfig:
      description: 'SessionRedis holds non-sensitive Redis connection parameters for distributed session storage.

        Populated only when MCPServer.spec.sessionStorage.provider == "redis".

        The Redis password is not included — it is injected as env var THV_SESSION_REDIS_PASSWORD.

        +optional'
      properties:
        address:
          description: Address is the Redis server address (host:port).
          type: string
        db:
          description: DB is the Redis database number.
          type: integer
        key_prefix:
          description: KeyPrefix is an optional prefix applied to all Redis keys used by ToolHive.
          type: string
      type: object
    github_com_stacklok_toolhive_pkg_authserver.CIMDRunConfig:
      description: 'CIMD controls client_id metadata document support. When enabled, the

        embedded authorization server accepts HTTPS URLs as client_id values

        and resolves them via the CIMD protocol instead of requiring DCR.'
      properties:
        cache_fallback_ttl:
          description: 'CacheFallbackTTL is the fixed TTL applied to every cached CIMD document.

            Cache-Control header parsing is not yet implemented; all entries use this value.

            Format: Go duration string (e.g. "5m", "10m", "1h").

            Defaults to 5 minutes when Enabled is true and this field is omitted.'
          example: 5m
          type: string
        cache_max_size:
          description: 'CacheMaxSize is the maximum number of CIMD documents held in the LRU cache.

            Defaults to 256 when Enabled is true and this field is zero.'
          type: integer
        enabled:
          description: Enabled activates CIMD client lookup when true.
          type: boolean
      type: object
    github_com_stacklok_toolhive_pkg_authserver.IdentityFromTokenRunConfig:
      description: 'IdentityFromToken extracts user identity (subject, name, email) directly from the

        OAuth2 token-endpoint response body using gjson dot-notation paths. When set, the

        embedded auth server skips the userinfo HTTP call entirely. Mirrors the CRD type

        (cmd/thv-operator/api/v1beta1.IdentityFromTokenConfig) — the authoritative

        trust-model and uniqueness documentation lives there.'
      properties:
        email_path:
          description: EmailPath is the dot-notation path to the email address field.
          type: string
        name_path:
          description: NamePath is the dot-notation path to the display name field.
          type: string
        subject_path:
          description: 'SubjectPath is the dot-notation path to the subject (user ID) field.

            Required when IdentityFromToken is set.'
          type: string
      type: object
    github_com_stacklok_toolhive_pkg_webhook.TLSConfig:
      description: TLSConfig holds optional TLS configuration (CA bundles, client certs).
      properties:
        ca_bundle_path:
          description: CABundlePath is the path to a CA certificate bundle for server verification.
          type: string
        client_cert_path:
          description: ClientCertPath is the path to a client certificate for mTLS.
          type: string
        client_key_path:
          description: ClientKeyPath is the path to a client key for mTLS.
          type: string
        insecure_skip_verify:
          description: 'InsecureSkipVerify disables server certificate verification.

            WARNING: This should only be used for development/testing.'
          type: boolean
      type: object
    github_com_stacklok_toolhive_pkg_telemetry.Config:
      description: 'DEPRECATED: Middleware configuration.

        TelemetryConfig contains the OpenTelemetry configuration'
      properties:
        caCertPath:
          description: 'CACertPath is the file path to a CA certificate bundle for the OTLP endpoint.

            When set, the OTLP exporters use this CA to verify the collector''s TLS certificate

            instead of relying solely on the system CA pool.

            +optional'
          type: string
        customAttributes:
          additionalProperties:
            type: string
          description: 'CustomAttributes contains custom resource attributes to be added to all telemetry signals.

            These are parsed from CLI flags (--otel-custom-attributes) or environment variables

            (OTEL_RESOURCE_ATTRIBUTES) as key=value pairs.

            +optional'
          type: object
        enablePrometheusMetricsPath:
          description: 'EnablePrometheusMetricsPath controls whether to expose Prometheus-style /metrics endpoint.

            The metrics are served on the main transport port at /metrics.

            This is separate from OTLP metrics which are sent to the Endpoint.

            +kubebuilder:default=false

            +optional'
          type: boolean
        endpoint:
          description: 'Endpoint is the OTLP endpoint URL

            +optional'
          type: string
        environmentVariables:
          description: 'EnvironmentVariables is a list of environment variable names that should be

            included in telemetry spans as attributes. Only variables in this list will

            be read from the host machine and included in spans for observability.

            Example: ["NODE_ENV", "DEPLOYMENT_ENV", "SERVICE_VERSION"]

            +optional'
          items:
            type: string
          type: array
          uniqueItems: false
        headers:
          additionalProperties:
            type: string
          description: 'Headers contains authentication headers for the OTLP endpoint.

            +optional'
          type: object
        insecure:
          description: 'Insecure indicates whether to use HTTP instead of HTTPS for the OTLP endpoint.

            +kubebuilder:default=false

            +optional'
          type: boolean
        metricsEnabled:
          description: 'MetricsEnabled controls whether OTLP metrics are enabled.

            When false, OTLP metrics are not sent even if an endpoint is configured.

            This is independent of EnablePrometheusMetricsPath.

            +kubebuilder:default=false

            +optional'
          type: boolean
        samplingRate:
          description: 'SamplingRate is the trace sampling rate (0.0-1.0) as a string.

            Only used when TracingEnabled is true.

            Example: "0.05" for 5% sampling.

            +kubebuilder:default="0.05"

            +optional'
          type: string
        serviceName:
          description: 'ServiceName is the service name for telemetry.

            When omitted, defaults to the server name (e.g., VirtualMCPServer name).

            +optional'
          type: string
        serviceVersion:
          description: 'ServiceVersion is the service version for telemetry.

            When omitted, defaults to the ToolHive version.

            +optional'
          type: string
        tracingEnabled:
          description: 'TracingEnabled controls whether distributed tracing is enabled.

            When false, no tracer provider is created even if an endpoint is configured.

            +kubebuilder:default=false

            +optional'
          type: boolean
        useLegacyAttributes:
          description: 'UseLegacyAttributes controls whether legacy (pre-MCP OTEL semconv) attribute names

            are emitted alongside the new standard attribute names. When true, spans include both

            old and new attribute names for backward compatibility with existing dashboards.

            Currently defaults to true; this will change to false in a future release.

            +kubebuilder:default=true

            +optional'
          type: boolean
      type: object
    github_com_stacklok_toolhive_pkg_audit.Config:
      description: 'DEPRECATED: Middleware configuration.

        AuditConfig contains the audit logging configuration'
      properties:
        component:
          description: 'Component is the component name to use in audit events.

            +optional'
          type: string
        detectApplicationErrors:
          description: 'DetectApplicationErrors controls whether the audit middleware inspects

            JSON-RPC response bodies for application-level errors when the HTTP

            status code indicates success (2xx). When enabled, a small prefix of

            the response body is buffered to detect JSON-RPC error fields,

            independent of the IncludeResponseData setting.

            +kubebuilder:default=true

            +optional'
          type: boolean
        enabled:
          description: 'Enabled controls whether audit logging is enabled.

            When true, enables audit logging with the configured options.

            +kubebuilder:default=false

            +optional'
          type: boolean
        eventTypes:
          description: 'EventTypes specifies which event types to audit. If empty, all events are audited.

            +optional'
          items:
            type: string
          type: array
          uniqueItems: false
        excludeEventTypes:
          description: 'ExcludeEventTypes specifies which event types to exclude from auditing.

            This takes precedence over EventTypes.

            +optional'
          items:
            type: string
          type: array
          uniqueItems: false
        includeRequestData:
          description: 'IncludeRequestData determines whether to include request data in audit logs.

            +kubebuilder:default=false

            +optional'
          type: boolean
        includeResponseData:
          description: 'IncludeResponseData determines whether to include response data in audit logs.

            +kubebuilder:default=false

            +optional'
          type: boolean
        logFile:
          description: 'LogFile specifies the file path for audit logs. If empty, logs to stdout.

            +optional'
          type: string
        maxDataSize:
          description: 'MaxDataSize limits the size of request/response data included in audit logs (in bytes).

            +kubebuilder:default=1024

            +optional'
          type: integer
      type: object
    github_com_stacklok_toolhive_cmd_thv-operator_api_v1beta1.RateLimitConfig:
      description: 'RateLimitConfig contains the CRD rate limiting configuration.

        When set, rate limiting middleware is added to the proxy middleware chain.'
      properties:
        perUser:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_ratelimit_types.RateLimitBucket'
        shared:

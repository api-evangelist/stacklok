        username_env_var:
          description: UsernameEnvVar is the environment variable containing the Redis username.
          type: string
      type: object
    github_com_stacklok_toolhive_pkg_workloads_upgrade.ConfigDrift:
      description: 'ConfigDrift describes posture differences (transport, permission profile)

        between the workload and the candidate registry entry.'
      properties:
        permission_profile:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_workloads_upgrade.StringChange'
        transport:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_workloads_upgrade.StringChange'

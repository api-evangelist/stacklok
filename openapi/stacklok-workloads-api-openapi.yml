            A request must pass both the server-level limit and the per-tool limit.

            +listType=map

            +listMapKey=name

            +optional'
          items:
            $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_ratelimit_types.ToolRateLimitConfig'
          type: array
          uniqueItems: false
      type: object
    github_com_stacklok_toolhive_pkg_core.Workload:

      properties:
        redis_config:
          $ref: '#/components/schemas/github_com_stacklok_toolhive_pkg_authserver_storage.RedisRunConfig'
        type:
          description: Type specifies the storage backend type. Defaults to "memory".
          type: string
      type: object
    pkg_api_v1.remoteOAuthConfig:

description: >-
  thv is the ToolHive command-line interface for running, managing, and governing Model
  Context Protocol (MCP) servers and agent skills locally, in containers, and on Kubernetes.
  It also starts the ToolHive API server (thv serve) that backs the desktop and cloud UIs.
install:
  - method: homebrew
    command: brew tap stacklok/tap && brew install thv
  - method: winget
    command: winget install stacklok.thv
  - method: binary
    command: Download from https://github.com/stacklok/toolhive/releases/latest
  - method: source
    command: go install github.com/stacklok/toolhive/cmd/thv@latest
